    <text x="48" y="201" font-size="57" font-weight="500" letter-spacing="-1.8">Define the work.</text>
    <text x="48" y="269" font-size="57" font-weight="500" letter-spacing="-1.8">Make execution explicit.</text>
    <text x="48" y="318" font-size="21" fill="#52606b">An agent-native language and runtime.</text>
  </g>
  <g font-family="'IBM Plex Mono','SFMono-Regular',Consolas,monospace">
    <text x="1152" y="61" text-anchor="end" fill="#52606b" font-size="13" letter-spacing="1.4">LANGUAGE / RUNTIME / TOOLS</text>
