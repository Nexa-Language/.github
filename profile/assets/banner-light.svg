    <rect x="254" y="90" width="46" height="220" rx="12" fill="#94A3B8"/>
    <path d="M146 130C220 130 180 270 254 270" fill="none" stroke="url(#neuralGrad)" stroke-width="46" stroke-linecap="round"/>
  </g>
