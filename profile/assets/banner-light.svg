<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title desc">
  <title id="title">Nexa — An agent-native language and runtime</title>
  <desc id="desc">Define the work. Make execution explicit. Nexa connects source declarations, bounded execution, and inspectable state.</desc>
  <defs>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="448" rx="8" fill="#f6f5f1"/>
  <g fill="none" stroke="#d9dcd9" stroke-width="1">
    <path d="M48 105H1152M48 367H1152M746 135V337"/>
    <path d="M1064 43h16m-8-8v16M1136 408h16m-8-8v16"/>
  </g>
  <!-- The established Nexa mark uses its original geometry and colors. -->
  <g transform="translate(32 17) scale(.16)">
